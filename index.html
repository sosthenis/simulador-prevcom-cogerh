
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --navy: #0f2744;
  --navy-mid: #1a3a5c;
  --teal: #0d7377;
  --teal-light: #14a085;
  --gold: #d4a853;
  --gold-light: #f0c06a;
  --red: #c0392b;
  --green: #1a7a4a;
  --bg: #f0f4f8;
  --card: #ffffff;
  --border: #dce4ef;
  --text: #1a2940;
  --muted: #6b7fa3;
  --font-display: 'DM Serif Display', serif;
  --font-body: 'DM Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: #0a2318;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── GLASSWAVE BACKGROUND ─────────────────────────────────────── */
.glasswave-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: linear-gradient(160deg, #072e1a 0%, #0a3d22 35%, #083020 65%, #061c14 100%);
}

/* Blobs que se movem criando o efeito de onda */
.gw-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.75;
  will-change: transform;
}
.gw-blob-1 {
  width: 750px; height: 750px;
  background: radial-gradient(circle, rgba(10,90,55,0.80) 0%, rgba(10,90,55,0) 70%);
  top: -220px; left: -160px;
  animation: wave1 8s ease-in-out infinite alternate;
}
.gw-blob-2 {
  width: 650px; height: 650px;
  background: radial-gradient(circle, rgba(5,50,30,0.85) 0%, rgba(5,50,30,0) 70%);
  bottom: -200px; right: -130px;
  animation: wave2 10s ease-in-out infinite alternate;
}
.gw-blob-3 {
  width: 550px; height: 550px;
  background: radial-gradient(circle, rgba(13,115,80,0.60) 0%, rgba(13,115,80,0) 70%);
  top: 38%; left: 28%;
  animation: wave3 6s ease-in-out infinite alternate;
}
.gw-blob-4 {
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(20,160,100,0.45) 0%, rgba(20,160,100,0) 70%);
  top: 12%; right: 8%;
  animation: wave4 7s ease-in-out infinite alternate;
}
.gw-blob-5 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(4,30,18,0.70) 0%, rgba(4,30,18,0) 70%);
  bottom: 18%; left: 4%;
  animation: wave5 9s ease-in-out infinite alternate;
}
.gw-blob-6 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(30,180,110,0.35) 0%, rgba(30,180,110,0) 70%);
  top: 55%; right: 20%;
  animation: wave6 5s ease-in-out infinite alternate;
}

/* Ondas SVG deslizando — 3 camadas */
.gw-waves {
  position: absolute;
  bottom: 0; left: 0;
  width: 200%; height: 200px;
  opacity: 0.45;
  animation: slideWave 8s linear infinite;
}
.gw-waves-2 {
  position: absolute;
  bottom: 40px; left: 0;
  width: 200%; height: 160px;
  opacity: 0.30;
  animation: slideWave 5s linear infinite reverse;
}
.gw-waves-3 {
  position: absolute;
  bottom: 80px; left: 0;
  width: 200%; height: 120px;
  opacity: 0.20;
  animation: slideWave 11s linear infinite;
}

@keyframes wave1 {
  0%   { transform: translate(0px, 0px) scale(1) rotate(0deg); }
  33%  { transform: translate(150px, 100px) scale(1.15) rotate(5deg); }
  66%  { transform: translate(80px, 200px) scale(0.90) rotate(-3deg); }
  100% { transform: translate(200px, 80px) scale(1.05) rotate(8deg); }
}
@keyframes wave2 {
  0%   { transform: translate(0px, 0px) scale(1); }
  33%  { transform: translate(-130px, -80px) scale(1.12); }
  66%  { transform: translate(-60px, -180px) scale(0.92); }
  100% { transform: translate(-180px, -60px) scale(1.08); }
}
@keyframes wave3 {
  0%   { transform: translate(0px, 0px) scale(1) rotate(0deg); }
  25%  { transform: translate(100px, -130px) scale(0.85) rotate(-6deg); }
  75%  { transform: translate(-80px, 100px) scale(1.15) rotate(4deg); }
  100% { transform: translate(60px, -80px) scale(1.05) rotate(-2deg); }
}
@keyframes wave4 {
  0%   { transform: translate(0px, 0px) scale(1); }
  50%  { transform: translate(-120px, 140px) scale(1.2); }
  100% { transform: translate(-60px, 60px) scale(0.88); }
}
@keyframes wave5 {
  0%   { transform: translate(0px, 0px) scale(1); }
  40%  { transform: translate(140px, -110px) scale(1.18); }
  100% { transform: translate(80px, -160px) scale(0.95); }
}
@keyframes wave6 {
  0%   { transform: translate(0px, 0px) scale(1); }
  100% { transform: translate(-100px, -120px) scale(1.25); }
}
@keyframes slideWave {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* Overlay de vidro sobre os blobs */
.gw-glass-overlay {
  position: absolute;
  inset: 0;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

/* Tudo acima do fundo */
.header, .progress-wrap, .container { position: relative; z-index: 1; }

/* Cards com efeito glassmorphism */
.card {
  background: rgba(255,255,255,0.78) !important;
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.55) !important;
  box-shadow: 0 8px 32px rgba(15,39,68,0.12), 0 1px 0 rgba(255,255,255,0.6) inset !important;
}

/* HEADER */
.header {
  background: #ffffff;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.header-logo {
  display: flex; align-items: center; gap: 12px;
}
.logo-badge {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--teal), var(--teal-light));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; color: white;
}
.logo-text { color: var(--navy); }
.logo-text .main { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.5px; }
.logo-text .sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.header-logo-right img { height: 48px; object-fit: contain; }

/* PROGRESS BAR */
.progress-wrap { background: var(--navy-mid); padding: 0 24px; }
.progress-steps { display: flex; max-width: 680px; margin: 0 auto; }
.progress-step {
  flex: 1; padding: 14px 8px 12px;
  text-align: center; position: relative; cursor: pointer;
  font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,0.35);
  transition: color 0.2s;
  border-bottom: 3px solid transparent;
}
.progress-step.active { color: var(--gold-light); border-bottom-color: var(--gold); }
.progress-step.done { color: var(--teal-light); border-bottom-color: var(--teal-light); }
.progress-step .step-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.1);
  font-size: 11px; font-weight: 700; margin-bottom: 4px;
}
.progress-step.active .step-num { background: var(--gold); color: var(--navy); }
.progress-step.done .step-num { background: var(--teal); color: white; }

/* MAIN CONTAINER */
.container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }

/* CARD */
.card {
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 24px rgba(15,39,68,0.08);
  overflow: hidden;
}
.card-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
  padding: 20px 24px;
  color: white;
}
.card-header h2 { font-family: var(--font-display); font-size: 22px; margin-bottom: 4px; }
.card-header p { font-size: 13px; color: rgba(255,255,255,0.55); }
.card-body { padding: 24px; }

/* FORM ELEMENTS */
.form-grid { display: grid; gap: 16px; }
.form-grid-2 { grid-template-columns: 1fr 1fr; }
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 12px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
}
.field label .required { color: var(--gold); }
.field input, .field select {
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 14px; font-weight: 500;
  color: var(--text);
  background: var(--card);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.field input:focus, .field select:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(13,115,119,0.12);
}
.field input.currency { padding-left: 28px; }
.field .input-wrap { position: relative; }
.field .input-wrap .prefix {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 13px; font-weight: 600;
}
.field .hint { font-size: 11px; color: var(--muted); }

/* RADIO GROUP */
.radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
.radio-option {
  flex: 1; min-width: 80px;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  font-size: 13px; font-weight: 500;
  transition: all 0.15s;
  user-select: none;
}
.radio-option:hover { border-color: var(--teal); }
.radio-option.selected {
  background: var(--teal); color: white;
  border-color: var(--teal);
}

/* TIPO SIMUL */
.tipo-cards { display: grid; gap: 10px; }
.tipo-card {
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  display: flex; align-items: flex-start; gap: 12px;
  transition: all 0.15s;
}
.tipo-card:hover { border-color: var(--teal); }
.tipo-card.selected { border-color: var(--teal); background: rgba(13,115,119,0.05); }
.tipo-card .tipo-num {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--border); font-size: 13px; font-weight: 700;
  flex-shrink: 0; transition: all 0.15s;
}
.tipo-card.selected .tipo-num { background: var(--teal); color: white; }
.tipo-card .tipo-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.tipo-card .tipo-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* SLIDER */
.slider-wrap { display: flex; flex-direction: column; gap: 8px; }
.slider-value-display {
  display: flex; align-items: center; justify-content: space-between;
}
.slider-val { font-size: 24px; font-weight: 700; color: var(--teal); }
.slider-val span { font-size: 14px; }
.slider-employer { font-size: 12px; color: var(--muted); }
input[type=range] {
  width: 100%; height: 6px; border-radius: 3px;
  appearance: none; background: var(--border);
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--teal);
  border: 3px solid white; box-shadow: 0 2px 6px rgba(13,115,119,0.4);
}
.slider-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }

/* INFO BOX */
.info-box {
  padding: 12px 14px;
  background: rgba(13,115,119,0.06);
  border-left: 3px solid var(--teal);
  border-radius: 0 8px 8px 0;
  font-size: 12px; color: var(--muted); line-height: 1.5;
}
.info-box strong { color: var(--teal); }
.warn-box {
  padding: 12px 14px;
  background: rgba(212,168,83,0.1);
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  font-size: 12px; color: #7a5a10; line-height: 1.5;
}

/* BUTTONS */
.btn-row { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
.btn {
  padding: 11px 24px; border-radius: 8px;
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; transition: all 0.15s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--teal), var(--teal-light));
  color: white;
  box-shadow: 0 2px 8px rgba(13,115,119,0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(13,115,119,0.4); }
.btn-secondary {
  background: transparent;
  color: var(--muted);
  border: 1.5px solid var(--border);
}
.btn-secondary:hover { border-color: var(--muted); color: var(--text); }

/* RESULTS */
.scenario-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.stab {
  flex: 1; padding: 9px; border-radius: 8px;
  font-size: 12px; font-weight: 600;
  cursor: pointer; text-align: center; border: 1.5px solid var(--border);
  transition: all 0.15s;
}
.stab.active-bear { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
.stab.active-base { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; }
.stab.active-bull { background: #d1fae5; border-color: #10b981; color: #065f46; }
.stab-label { font-size: 10px; font-weight: 400; opacity: 0.75; display: block; }
.stab-rate { font-size: 15px; font-weight: 700; }

/* RESULT GRID */
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.result-card {
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
}
.result-card.sem { border-top: 3px solid var(--muted); }
.result-card.com { border-top: 3px solid var(--teal); }
.result-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.result-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--bg); font-size: 12px; }
.result-row:last-child { border-bottom: none; }
.result-row .val { font-weight: 600; }
.result-row .val.red { color: var(--red); }
.result-row .val.green { color: var(--green); }
.result-row .val.gold { color: #b07d1a; }
.result-total {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0 0; margin-top: 6px;
  border-top: 2px solid var(--navy);
}
.result-total .label { font-size: 12px; font-weight: 700; }
.result-total .amount { font-size: 18px; font-weight: 700; font-family: var(--font-display); }
.result-total.com .amount { color: var(--teal); }
.result-total.sem .amount { color: var(--navy); }

.variacao-banner {
  padding: 14px 18px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.variacao-banner.positive { background: rgba(26,122,74,0.08); border: 1px solid rgba(26,122,74,0.25); }
.variacao-banner.negative { background: rgba(192,57,43,0.08); border: 1px solid rgba(192,57,43,0.25); }
.variacao-banner .vb-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.variacao-banner .vb-value { font-size: 20px; font-weight: 700; font-family: var(--font-display); }
.variacao-banner.positive .vb-value { color: var(--green); }
.variacao-banner.negative .vb-value { color: var(--red); }
.variacao-banner .vb-pct { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
.variacao-banner.positive .vb-pct { background: rgba(26,122,74,0.12); color: var(--green); }
.variacao-banner.negative .vb-pct { background: rgba(192,57,43,0.12); color: var(--red); }

/* CHART */
.chart-wrap {
  padding: 0 0 8px;
}
.chart-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

/* BAR CHART MANUAL */
.bar-chart { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-row-label { font-size: 11px; font-weight: 600; width: 95px; flex-shrink: 0; color: var(--muted); text-align: right; }
.bar-track { flex: 1; height: 28px; background: var(--bg); border-radius: 6px; position: relative; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); min-width: 30px; }
.bar-fill span { font-size: 11px; font-weight: 700; color: white; white-space: nowrap; }
.bar-row-diff { font-size: 11px; font-weight: 700; width: 60px; flex-shrink: 0; }

/* ACUMULADO SECTION */
.acum-wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.acum-card {
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  text-align: center;
}
.acum-card .ac-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.acum-card .ac-value { font-size: 16px; font-weight: 700; font-family: var(--font-display); }
.acum-card.bear .ac-value { color: #ef4444; }
.acum-card.base .ac-value { color: #3b82f6; }
.acum-card.bull .ac-value { color: #10b981; }

/* RISCO SECTION */
.risco-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.risco-card { padding: 14px; border-radius: 10px; border: 1px solid var(--border); }
.risco-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.risco-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
.risco-row .rl { color: var(--muted); }
.risco-row .rv { font-weight: 600; }

/* EFEITO LIQUIDO */
.efeito-box {
  padding: 16px; border-radius: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
}
.efeito-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
.efeito-row:last-child { border-bottom: none; font-weight: 700; font-size: 14px; }
.efeito-row .er-label { color: var(--text); }
.efeito-row .er-val { font-weight: 500; }

/* DIVIDER */
.section-divider { margin: 20px 0; border: none; border-top: 1px solid var(--border); }
.section-title { font-size: 13px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; display: block; width: 4px; height: 16px; background: var(--teal); border-radius: 2px; }

/* FOOTER NOTE */
.footer-note { font-size: 11px; color: var(--muted); line-height: 1.5; padding: 12px; background: var(--bg); border-radius: 8px; margin-top: 16px; }

/* RECOMEÇAR */
.btn-restart { background: transparent; color: var(--muted); border: 1.5px solid var(--border); padding: 8px 16px; border-radius: 8px; font-family: var(--font-body); font-size: 13px; cursor: pointer; font-weight: 600; }
.btn-restart:hover { border-color: var(--muted); }

/* PDF BUTTON */
.btn-pdf {
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(192,57,43,0.3);
  transition: all 0.15s;
}
.btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(192,57,43,0.4); }
.btn-pdf:disabled { opacity: 0.6; cursor: wait; }

@media (max-width: 600px) {
  .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
  .result-grid { grid-template-columns: 1fr; }
  .acum-wrap { grid-template-columns: 1fr; }
  .risco-grid { grid-template-columns: 1fr; }
  .progress-step .step-label { display: none; }

  /* HEADER RESPONSIVO */
  .header {
    padding: 10px 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-logo {
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .logo-badge {
    width: 34px; height: 34px;
    font-size: 15px;
    flex-shrink: 0;
  }
  .logo-text .main {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .logo-text .sub {
    font-size: 9px;
    letter-spacing: 0.5px;
  }
  /* Botão + logo ficam na segunda linha, centralizados */
  .header > div:last-child {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .header-logo-right img {
    height: 36px;

<script>
// ================================================================
// FINANCIAL ENGINE
// ================================================================
const RGPS = 8475.55;
const EMPLOYER_RATE = 0.085;
const RPPS_CONTRIB_BENEFIT = 0.14;
const RPPS_EXEMPTION = 3242.00;
const POST_RETIRE_RATE = 0.01;
const LOADING_FEE = 0.00;

function irProg(base) {
  const b = Math.max(0, base);
  if (b <= 2824) return 0;
  if (b <= 3751.05) return b*0.075 - 211.80;
  if (b <= 5050.80) return b*0.15 - 493.84;
  if (b <= 6448.95) return b*0.225 - 873.58;
  return b*0.275 - 1195.82;
}
function irRegr(base, years) {
  const b = Math.max(0, base);
  if (years >= 10) return b * 0.10;
  if (years >= 8) return b * 0.15;
  if (years >= 6) return b * 0.20;
  if (years >= 4) return b * 0.25;
  if (years >= 2) return b * 0.30;
  return b * 0.35;
}
function accumulate(salary, years, empRate, rate, portability, existing) {
  const mr = Math.pow(1 + rate, 1/12) - 1;
  const mg = Math.pow(1.01, 1/12) - 1;
  let saldo = portability + existing;
  const months = Math.round(years * 12);
  for (let m = 0; m < months; m++) {
    const sal = salary * Math.pow(1 + mg, m);
    const above = Math.max(0, sal - RGPS);
    saldo = saldo * (1 + mr) + above * (empRate + EMPLOYER_RATE);
  }
  return Math.max(0, saldo);
}
function rpcBenefit(saldo, years, postRate) {
  if (!saldo || years <= 0) return 0;
  const mr = Math.pow(1 + postRate, 1/12) - 1;
  const n = Math.round(years * 12);
  if (mr < 1e-8) return saldo / n;
  return saldo * mr / (1 - Math.pow(1 + mr, -n));
}
function fmtBRL(v) {
  return 'R$\u00a0' + (v||0).toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtPct(v) {
  return (v*100).toFixed(1).replace('.',',') + '%';
}

// ================================================================
// STATE
// ================================================================
const STEPS = ['Identificação','Financeiro','RPC','Resultados'];
const SCENARIOS = [
  {key:'bear', label:'Pessimista', rate:0.03, color:'#ef4444', bg:'#fee2e2', tabCls:'active-bear'},
  {key:'base', label:'Base',      rate:0.04, color:'#3b82f6', bg:'#dbeafe', tabCls:'active-base'},
  {key:'bull', label:'Otimista',  rate:0.05, color:'#10b981', bg:'#d1fae5', tabCls:'active-bull'},
];
// Convênio COGERH × CE-PREVCOM — empregados CLT/RGPS
const TIPOS = [
  {val:'1', title:'Ingresso no RPC CE-PREVCOM', desc:'Empregado(a) COGERH que ainda não aderiu ao plano e deseja simular o benefício complementar sobre o INSS.'},
  {val:'2', title:'Já Participante CE-PREVCOM', desc:'Empregado(a) que já contribui para o RPC e deseja projetar o saldo e o benefício na aposentadoria.'},
];
const CATS = [
  {val:'1', label:'Empregado(a) COGERH'},
];
function retireAge(cat, sex) {
  // Regra RGPS/INSS — EC 103/2019
  return sex === 'M' ? 65 : 62;
}

let state = {
  step: 0,
  scenario: 'base',
  // Step 0
  idade: '', sexo: 'M', cat: '1', tipo: '1', tempoContrib: '',
  // Step 1 — COGERH CLT/RGPS
  salario: '', inssEstimado: '',
  // Step 2
  aliquota: 8.5, prazo: 25, tributo: 'R', portabilidade: '0', saldoAtual: '0', idadeAposentadoria: '',
};

// Tabela progressiva INSS 2025 (CLT)
function inssContrib(salary) {
  const s = Math.min(salary, 7786.02);
  if (s <= 1518.00)  return s * 0.075;
  if (s <= 2793.88)  return 1518.00*0.075 + (s-1518.00)*0.09;
  if (s <= 4190.83)  return 1518.00*0.075 + (2793.88-1518.00)*0.09  + (s-2793.88)*0.12;
  return               1518.00*0.075 + (2793.88-1518.00)*0.09  + (4190.83-2793.88)*0.12 + (s-4190.83)*0.14;
}
// Alíquota marginal IRPF aproximada para cálculo de economia fiscal
function marginalIR(base) {
  if (base <= 2824)    return 0;
  if (base <= 3751.05) return 0.075;
  if (base <= 5050.80) return 0.15;
  if (base <= 6448.95) return 0.225;
  return 0.275;
}

// ================================================================
// RENDER ENGINE
// ================================================================
function render() {
  renderProgress();
  const app = document.getElementById('app');
  if (state.step === 0) app.innerHTML = renderStep0();

}

function renderProgress() {

      <div class="step-num">${i < state.step ? '✓' : i+1}</div>

}

        <div class="info-box">
          <strong>Convênio COGERH × CE-PREVCOM:</strong> empregados(as) da COGERH são vinculados ao <strong>RGPS (INSS)</strong>, sem RPPS. O plano CE-PREVCOM é a previdência complementar fechada (EFPC) patrocinada pela COGERH, nos termos da LC nº 109/2001. A COGERH contribui com <strong>8,5%</strong> sobre o excedente ao teto INSS, em paridade com o empregado (até 8,5%).

      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="nextStep()">Próximo →</button>
      </div>

  </div>`;
}

function renderStep1() {
  return `<div class="card">
    <div class="card-header">
      <h2>Dados Financeiros</h2>
      <p>Remuneração atual e estimativa de benefício INSS na aposentadoria</p>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field">
          <label>Remuneração atual (base de contribuição ao INSS) <span class="required">*</span></label>
          <div class="input-wrap">
            <span class="prefix">R$</span>
            <input type="number" class="currency" id="f_salario" value="${state.salario}" placeholder="0,00" min="0" step="100">
          </div>
          <span class="hint">Soma das rubricas do contracheque com incidência previdenciária (INSS). Consulte o RH ou o holerite.</span>
        </div>

        <div class="field">
          <label>Estimativa do benefício INSS/RGPS na aposentadoria <span class="required">*</span></label>
          <div class="input-wrap">
            <span class="prefix">R$</span>
            <input type="number" class="currency" id="f_rpps" value="${state.inssEstimado}" placeholder="0,00" min="0" step="100">
          </div>
          <span class="hint">Valor máximo: ${fmtBRL(RGPS)} (teto INSS 2025). Baseado na média dos salários de contribuição. Consulte o CNIS ou o RH para estimativa personalizada.</span>
        </div>

        <div class="info-box">
          <strong>Convênio COGERH × CE-PREVCOM:</strong> como empregado(a) CLT vinculado ao RGPS (INSS), seu benefício previdenciário obrigatório está limitado ao teto de <strong>${fmtBRL(RGPS)}</strong>. O RPC da CE-PREVCOM complementa essa renda na aposentadoria, sem limite de acumulação.<br><br>
          <strong>Base legal:</strong> Lei Complementar nº 109/2001 · Res. CGPC nº 06/2003 · Convênio COGERH/CE-PREVCOM.
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="prevStep()">← Voltar</button>
        <button class="btn btn-primary" onclick="nextStep()">Próximo →</button>
      </div>
    </div>
  </div>`;
}

function renderStep2() {
  const ra = retireAge(state.cat, state.sexo);
  const idadeAtual = parseFloat(state.idade)||0;
  const idadeAposentadoria = parseFloat(state.idadeAposentadoria)||ra;
  const anos = Math.max(0, idadeAposentadoria - idadeAtual);

  return `<div class="card">
    <div class="card-header">

        <div class="field">

          <div class="slider-wrap">

                <div class="slider-val">${state.aliquota.toFixed(1).replace('.',',')}%<span> /mês</span></div>
                <div class="slider-employer">+ ${(EMPLOYER_RATE*100).toFixed(1).replace('.',',')}% do patrocinador → total ${totalRate.toFixed(1).replace('.',',')}%</div>
              </div>
            </div>
            <input type="range" id="f_aliq" min="6" max="8.5" step="0.5" value="${state.aliquota}">
            <div class="slider-labels">

            </div>
          </div>
          <span class="hint">Alíquota incide sobre a parcela da remuneração <strong>acima do teto do RGPS</strong> (${fmtBRL(RGPS)})</span>
        </div>

        <div class="form-grid form-grid-2">
          <div class="field">

            <span class="hint">Mínimo legal: ${ra} anos · Compulsória: 75</span>
          </div>
          <div class="field">
            <label>Prazo de recebimento do RPC (anos)</label>

            <span class="hint">Entre 5 e 30 anos (mín./máx. regulamento)</span>

        <div class="field">

            <div class="radio-option ${state.tributo==='P'?'selected':''}" onclick="setTributo('P')">Progressivo</div>

        </div>

            </div>
          </div>

            <div class="input-wrap">

          a contribuição mensal estimada ao RPC (acima do teto) é de
          <strong>${fmtBRL(Math.max(0,(parseFloat(state.salario)||0)-RGPS)*(empRate+EMPLOYER_RATE))}</strong>.
          (Crece conforme reajuste salarial projetado de 1% a.a. real)
        </div>
      </div>

      <div class="btn-row">

function computeAll() {
  const salary      = parseFloat(state.salario)||0;
  const inssEstim   = Math.min(parseFloat(state.inssEstimado)||0, RGPS); // COGERH CLT: teto RGPS
  const empRate     = state.aliquota / 100;
  const portability = parseFloat(state.portabilidade)||0;
  const existing    = parseFloat(state.saldoAtual)||0;
  const prazo       = Math.min(30, Math.max(5, parseFloat(state.prazo)||25));
  const regimeTrib  = state.tributo;
  const ra          = retireAge(state.cat, state.sexo);
  const idadeAtual  = parseFloat(state.idade)||0;
  const idadeAposen = parseFloat(state.idadeAposentadoria)||ra;
  const yearsToRetire = Math.max(0, idadeAposen - idadeAtual);

  // ── Contracheque ATIVO ─────────────────────────────────────────
  // COGERH CLT: INSS progressivo sobre salário (até teto INSS) + RPC sobre excedente ao RGPS
  const inssAtivo      = inssContrib(salary);
  const rpcContribEmp  = Math.max(0, salary - RGPS) * empRate;
  const rpcContribPat  = Math.max(0, salary - RGPS) * EMPLOYER_RATE;
  const rpcContribTotal= rpcContribEmp + rpcContribPat;

  // IR mensal SEM RPC (base = salário - INSS)
  const baseIR_sem = Math.max(0, salary - inssAtivo);
  const irSal_sem  = irProg(baseIR_sem);
  const liqSal_sem = salary - inssAtivo - irSal_sem;

  // IR mensal COM RPC — contribuição do empregado deduz a base IR (PGBL/EFPC, Lei 9.250)
  const baseIR_com = Math.max(0, salary - inssAtivo - rpcContribEmp);
  const irSal_com  = irProg(baseIR_com);
  const liqSal_com = salary - inssAtivo - rpcContribEmp - irSal_com;
  const efeitoLiqMensal = liqSal_com - liqSal_sem; // geralmente negativo (custo mensal líquido do RPC)

  // ── Dedução IRPF anual — até 12% da renda bruta (LC 109/2001 + Lei 9.250) ──────
  const rendaBrutaAnual   = salary * 12;
  const contrib12pct      = rendaBrutaAnual * 0.12;
  const rpcAnualEmp       = rpcContribEmp * 12;
  const deducaoEfetiva    = Math.min(rpcAnualEmp, contrib12pct);
  const baseIR_anual_sem  = Math.max(0, baseIR_sem) * 12;
  const baseIR_anual_com  = Math.max(0, baseIR_sem * 12 - deducaoEfetiva);
  const irAnual_sem       = irProg(baseIR_anual_sem / 12) * 12;
  const irAnual_com       = irProg(baseIR_anual_com / 12) * 12;
  const economiaIRanual   = Math.max(0, irAnual_sem - irAnual_com);
  const economiaMensal    = economiaIRanual / 12;
  const custoLiquidoMensal= rpcContribEmp - economiaMensal; // custo real após benefício fiscal

  return SCENARIOS.map(sc => {
    const rate     = sc.rate;
    const saldo    = accumulate(salary, yearsToRetire, empRate, rate, portability, existing);
    const rpcGross = rpcBenefit(saldo, prazo, POST_RETIRE_RATE);

    // ── APOSENTADORIA SEM RPC ─────────────────────────────────────
    // COGERH CLT: RGPS/INSS, sem contribuição de inativo (não existe para CLT)
    const irSem  = irProg(inssEstim);  // IR progressivo sobre benefício INSS
    const liqSem = inssEstim - irSem;

    // ── APOSENTADORIA COM RPC ─────────────────────────────────────
    const irINSS = irProg(inssEstim);
    const inssLiq = inssEstim - irINSS;
    const irRPC  = regimeTrib === 'R'
      ? Math.max(0, irRegr(rpcGross, yearsToRetire))
      : Math.max(0, irProg(rpcGross));
    const rpcLiq = rpcGross - irRPC;
    const liqCom = inssLiq + rpcLiq;

    const variacao    = liqCom - liqSem;
    const variacaoPct = liqSem > 0 ? variacao / liqSem : 0;

    // ── BENEFÍCIOS DE RISCO (simplificado) ───────────────────────
    const irPensaoSem  = irProg(inssEstim);
    const pensaoLiqSem = inssEstim - irPensaoSem;
    const irPensaoRPC  = regimeTrib === 'R'
      ? Math.max(0, irRegr(rpcGross, yearsToRetire))
      : Math.max(0, irProg(rpcGross));
    const pensaoLiqCom = (inssEstim - irProg(inssEstim)) + rpcGross - irPensaoRPC;

    return { ...sc, rate, saldo, rpcGross, rpcLiq,
      inssEstim, liqSem, liqCom, variacao, variacaoPct,
      irSem, irINSS, irRPC,
      inssAtivo, rpcContribEmp, rpcContribPat, rpcContribTotal,
      irSal_sem, irSal_com, liqSal_sem, liqSal_com, efeitoLiqMensal,
      deducaoEfetiva, rpcAnualEmp, contrib12pct, economiaIRanual,
      economiaMensal, custoLiquidoMensal, rendaBrutaAnual,
      salary, yearsToRetire, prazo,
      pensaoLiqSem, pensaoLiqCom,
    };
  });
}

function renderResults() {
  const data = computeAll();
  const sc   = data.find(d => d.key === state.scenario) || data[1];
  const isPos = sc.variacao >= 0;

  const maxLiq  = Math.max(...data.map(d => Math.max(d.liqSem, d.liqCom)), 1);
  const barScale = v => Math.max(5, (v / maxLiq * 100)).toFixed(1);

  return `<div id="resultado-pdf" style="display:flex;flex-direction:column;gap:16px;">

    <!-- SCENARIO TABS -->
    <div>
      <div class="scenario-tabs">
        ${data.map(d => `<div class="stab ${state.scenario===d.key?d.tabCls:''}" onclick="setScenario('${d.key}')">
          <div class="stab-label">${d.label}</div>
          <div class="stab-rate">${(d.rate*100).toFixed(0)}% a.a.</div>
        </div>`).join('')}
      </div>

      <!-- VARIAÇÃO BANNER -->
      <div class="variacao-banner ${isPos?'positive':'negative'}">
        <div>
          <div class="vb-label">${isPos?'▲ Ganho de renda líquida na aposentadoria':'▼ Redução de renda líquida na aposentadoria'}</div>
          <div class="vb-value">${fmtBRL(Math.abs(sc.variacao))} / mês</div>
        </div>
        <div class="vb-pct">${isPos?'+':'−'}${fmtPct(Math.abs(sc.variacaoPct))}</div>
      </div>

      <!-- COMPARISON GRID — COGERH CLT/RGPS -->
      <div class="result-grid">
        <div class="result-card sem">
          <div class="result-label">🔴 Sem RPC (só INSS/RGPS)</div>
          <div class="result-row"><span>Benefício INSS bruto</span><span class="val">${fmtBRL(sc.inssEstim)}</span></div>
          <div class="result-row"><span style="font-size:11px;color:var(--green)">✓ Sem contrib. de inativo (CLT)</span><span class="val" style="color:var(--green)">R$&nbsp;0,00</span></div>
          <div class="result-row"><span>(−) IR Progressivo</span><span class="val red">−${fmtBRL(sc.irSem)}</span></div>
          <div class="result-total sem">
            <span class="label">Renda Líquida</span>
            <span class="amount">${fmtBRL(sc.liqSem)}</span>
          </div>
        </div>
        <div class="result-card com">
          <div class="result-label">🟢 Com RPC (INSS + CE-Prevcom)</div>
          <div class="result-row"><span>Benefício INSS bruto</span><span class="val">${fmtBRL(sc.inssEstim)}</span></div>
          <div class="result-row"><span>Benefício RPC bruto</span><span class="val gold">${fmtBRL(sc.rpcGross)}</span></div>
          <div class="result-row"><span>(−) IR s/ INSS</span><span class="val red">−${fmtBRL(sc.irINSS)}</span></div>
          <div class="result-row"><span>(−) IR s/ RPC (${state.tributo==='R'?'regressivo':'progressivo'})</span><span class="val red">−${fmtBRL(sc.irRPC)}</span></div>
          <div class="result-total com">
            <span class="label">Renda Líquida</span>
            <span class="amount">${fmtBRL(sc.liqCom)}</span>
          </div>
        </div>
      </div>

      <!-- BAR CHART -->
      <div class="card" style="margin-top:0;">
        <div class="card-body" style="padding:16px;">
          <div class="chart-title">Comparativo de renda líquida por cenário de taxa</div>
          <div class="bar-chart">
            ${data.map(d => {
              const semW = barScale(d.liqSem);
              const comW = barScale(d.liqCom);
              return `<div>
                <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;">${d.label} (${(d.rate*100).toFixed(0)}% a.a. real)</div>
                <div class="bar-row">
                  <div class="bar-row-label">Só INSS</div>
                  <div class="bar-track"><div class="bar-fill" style="width:${semW}%;background:var(--muted);"><span>${fmtBRL(d.liqSem)}</span></div></div>
                </div>
                <div class="bar-row">
                  <div class="bar-row-label">INSS + RPC</div>
                  <div class="bar-track"><div class="bar-fill" style="width:${comW}%;background:var(--teal);"><span>${fmtBRL(d.liqCom)}</span></div></div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- SALDO ACUMULADO -->
    <div class="card">
      <div class="card-body" style="padding:16px;">
        <div class="section-title">Saldo acumulado na CE-PREVCOM na aposentadoria</div>
        <div class="acum-wrap">
          ${data.map(d => `<div class="acum-card ${d.key}">
            <div class="ac-label">${d.label} · ${(d.rate*100).toFixed(0)}%</div>
            <div class="ac-value">${fmtBRL(d.saldo)}</div>
          </div>`).join('')}
        </div>
        <div class="hint" style="font-size:11px;color:var(--muted);margin-top:8px;">
          Acumulação de ${sc.yearsToRetire.toFixed(1)} anos | Contrib. total (empregado ${state.aliquota}% + COGERH 8,5%) | Prazo de recebimento: ${sc.prazo} anos | Taxa pós: 1,0% a.a. real
        </div>
      </div>
    </div>

    <!-- EFEITO NO CONTRACHEQUE (todos os tipos COGERH) -->
    <div class="card">
      <div class="card-body" style="padding:16px;">
        <div class="section-title">Efeito no contracheque ao aderir ao RPC</div>
        <div class="efeito-box">
          <div class="efeito-row">
            <span class="er-label">Remuneração bruta</span>
            <span class="er-val">${fmtBRL(sc.salary)}</span>
          </div>
          <div class="efeito-row">
            <span class="er-label">(−) INSS ativo (tabela progressiva)</span>
            <span class="er-val" style="color:var(--red)">−${fmtBRL(sc.inssAtivo)}</span>
          </div>
          <div class="efeito-row">
            <span class="er-label">IR na Fonte — sem RPC</span>
            <span class="er-val" style="color:var(--red)">−${fmtBRL(sc.irSal_sem)}</span>
          </div>
          <div class="efeito-row" style="background:rgba(15,39,68,0.04);padding:6px 8px;border-radius:6px;">
            <span class="er-label">Líquido atual (sem RPC)</span>
            <span class="er-val" style="font-size:15px;font-weight:700;">${fmtBRL(sc.liqSal_sem)}</span>
          </div>
          <div class="efeito-row" style="margin-top:6px;">
            <span class="er-label">(−) Contrib. RPC empregado (${state.aliquota}% s/ excedente ao teto INSS)</span>
            <span class="er-val" style="color:var(--teal)">−${fmtBRL(sc.rpcContribEmp)}</span>
          </div>
          <div class="efeito-row">
            <span class="er-label">IR na Fonte — com RPC (base reduzida pela contrib.)</span>
            <span class="er-val" style="color:var(--red)">−${fmtBRL(sc.irSal_com)}</span>
          </div>
          <div class="efeito-row">
            <span class="er-label" style="font-weight:700;">Diferença mensal líquida ao aderir ao RPC</span>
            <span class="er-val" style="color:${sc.efeitoLiqMensal>=0?'var(--green)':'var(--red)'};font-size:16px;font-weight:700;">${sc.efeitoLiqMensal>=0?'+':''}${fmtBRL(sc.efeitoLiqMensal)}</span>
          </div>
        </div>
        <div class="info-box" style="margin-top:12px;">
          A contribuição ao RPC (${fmtBRL(sc.rpcContribEmp)}/mês) é dedutível da base de IR na fonte (LC 109/2001), reduzindo o IR em <strong>${fmtBRL(sc.irSal_sem - sc.irSal_com)}/mês</strong>. O custo real mensal do RPC é de <strong>${fmtBRL(Math.abs(sc.efeitoLiqMensal))}/mês</strong>, que vai para sua conta individual e retorna como benefício na aposentadoria.
        </div>
      </div>
    </div>

    <!-- DEDUÇÃO IRPF ANUAL — 12% DA RENDA BRUTA -->
    <div class="card">
      <div class="card-body" style="padding:16px;">
        <div class="section-title">Benefício Fiscal — Dedução IRPF Anual (até 12%)</div>
        <div class="info-box" style="margin-bottom:14px;">
          Contribuições a planos de previdência complementar fechada (EFPC) são <strong>dedutíveis na Declaração Anual do IRPF até o limite de 12% da renda bruta tributável</strong> (art. 11 da Lei nº 9.250/1995 c/c LC nº 109/2001). Este benefício reduz o imposto a pagar ou aumenta a restituição.
        </div>
        <div class="efeito-box">
          <div class="efeito-row">
            <span class="er-label">Renda bruta tributável anual</span>
            <span class="er-val">${fmtBRL(sc.rendaBrutaAnual)}</span>
          </div>
          <div class="efeito-row">
            <span class="er-label">Limite dedutível (12% da renda bruta anual)</span>
            <span class="er-val" style="color:var(--navy);font-weight:700;">${fmtBRL(sc.contrib12pct)}</span>
          </div>
          <div class="efeito-row">
            <span class="er-label">Contribuição anual do empregado ao RPC</span>
            <span class="er-val" style="color:var(--teal)">${fmtBRL(sc.rpcAnualEmp)}</span>
          </div>
          <div class="efeito-row" style="background:rgba(13,115,119,0.06);padding:6px 8px;border-radius:6px;">
            <span class="er-label">Dedução efetiva aplicável (menor valor)</span>
            <span class="er-val" style="font-weight:700;color:var(--teal)">${fmtBRL(sc.deducaoEfetiva)}</span>
          </div>
          <div class="efeito-row" style="background:rgba(26,122,74,0.08);padding:6px 8px;border-radius:6px;margin-top:4px;">
            <span class="er-label" style="font-weight:700;">Economia de IR no ajuste anual</span>
            <span class="er-val" style="color:var(--green);font-size:16px;font-weight:700;">${fmtBRL(sc.economiaIRanual)}/ano</span>
          </div>
          <div class="efeito-row">
            <span class="er-label">Equivalente mensal do benefício fiscal</span>
            <span class="er-val" style="color:var(--green);font-weight:700;">+ ${fmtBRL(sc.economiaMensal)}/mês</span>
          </div>
          <div class="efeito-row">
            <span class="er-label" style="font-weight:700;">Custo líquido real do RPC (após IR)</span>
            <span class="er-val" style="color:${sc.custoLiquidoMensal<=0?'var(--green)':'var(--red)'};font-size:15px;font-weight:700;">${fmtBRL(Math.abs(sc.custoLiquidoMensal))}/mês ${sc.custoLiquidoMensal<=0?'(ganho líquido)':''}</span>
          </div>
        </div>
        <div class="warn-box" style="margin-top:12px;">
          ⚠ A dedução de 12% aplica-se exclusivamente às contribuições do <strong>participante</strong> (não inclui a parte da COGERH). Valores sujeitos à comprovação na DIRPF. Consulte seu contador ou a CE-PREVCOM.
        </div>
      </div>
    </div>

    <!-- COBERTURA DE RISCO -->
    <div class="card">
      <div class="card-body" style="padding:16px;">
        <div class="section-title">Benefícios de risco — estimativa (INSS + CE-PREVCOM)</div>
        <div class="risco-grid">
          <div class="risco-card">
            <div class="risco-title">⚰ Pensão por Morte</div>
            <div class="risco-row"><span class="rl">Sem RPC (apenas INSS)</span><span class="rv">${fmtBRL(sc.pensaoLiqSem)}/mês</span></div>
            <div class="risco-row"><span class="rl">Com RPC (INSS + CE-Prevcom)</span><span class="rv" style="color:var(--teal)">${fmtBRL(sc.pensaoLiqCom)}/mês</span></div>
          </div>
          <div class="risco-card">
            <div class="risco-title">🏥 Aposentadoria por Invalidez</div>
            <div class="risco-row"><span class="rl">Sem RPC (apenas INSS)</span><span class="rv">${fmtBRL(sc.pensaoLiqSem)}/mês</span></div>
            <div class="risco-row"><span class="rl">Com RPC (INSS + CE-Prevcom)</span><span class="rv" style="color:var(--teal)">${fmtBRL(sc.pensaoLiqCom)}/mês</span></div>
          </div>
        </div>
        <div class="warn-box" style="margin-top:10px;">
          ⚠ Estimativa simplificada. O RPC CE-PREVCOM pode oferecer cobertura adicional de risco via PAR. Consulte a CE-PREVCOM para os valores exatos do seu plano.
        </div>
      </div>
    </div>

    <div class="footer-note">
      📋 <strong>Simulação ilustrativa — Convênio COGERH × CE-PREVCOM.</strong> Empregados CLT/RGPS. Crescimento salarial real projetado: 1,0% a.a. · IR Regressivo após 10 anos: 10% · Teto INSS 2025: ${fmtBRL(RGPS)} · Contrib. patrocinador (COGERH): 8,5% · LC nº 109/2001 · Versão 2026.01-1.<br>
      Esta simulação não substitui assessoria previdenciária profissional. Consulte a CE-PREVCOM antes de tomar qualquer decisão.
    </div>

    <div class="pdf-actions" style="text-align:center; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding-top:8px;">
      <button class="btn-pdf" id="btnPDF" onclick="gerarPDF()">📄 Baixar PDF da Simulação</button>
      <button class="btn-restart btn-print" onclick="window.print()">🖨️ Imprimir</button>
      <button class="btn-restart" onclick="restart()">↺ Nova Simulação</button>
    </div>
  </div>`;
}

// ================================================================
// ACTIONS
// ================================================================
function setSexo(v) { state.sexo = v; render(); }
function setCat(v) { state.cat = v; render(); }
function setTipo(v) { state.tipo = v; render(); }
function setTributo(v) { state.tributo = v; render(); }
function setScenario(v) { state.scenario = v; renderProgress(); document.getElementById('app').innerHTML = renderResults(); attachListeners(); }
function goStep(i) { if (i <= state.step) { state.step = i; render(); } }
function restart() { state.step = 0; state.scenario = 'base'; render(); }

function readFormStep0() {
  state.idade = document.getElementById('f_idade')?.value || state.idade;
  state.tempoContrib = document.getElementById('f_tempo')?.value || state.tempoContrib;
}
function readFormStep1() {
  state.salario       = document.getElementById('f_salario')?.value || state.salario;
  state.inssEstimado  = document.getElementById('f_rpps')?.value   || state.inssEstimado;
}
function readFormStep2() {
  const ai = document.getElementById('f_idadeAposen');
  if (ai) state.idadeAposentadoria = ai.value;
  const pr = document.getElementById('f_prazo');
  if (pr) state.prazo = pr.value;
  const sl = document.getElementById('f_saldo');
  if (sl) state.saldoAtual = sl.value;
  const po = document.getElementById('f_port');
  if (po) state.portabilidade = po.value;
}

function validateStep(step) {
  if (step === 0) {
    const idade = parseFloat(state.idade);
    if (!idade || idade < 18 || idade > 74) { alert('Informe sua idade atual (18–74 anos).'); return false; }
    if (!state.tempoContrib) { alert('Informe o tempo de contribuição ao INSS.'); return false; }
    return true;
  }
  if (step === 1) {
    if (!parseFloat(state.salario)) { alert('Informe sua remuneração atual.'); return false; }
    if (!parseFloat(state.inssEstimado)) { alert('Informe a estimativa de benefício INSS na aposentadoria.'); return false; }
    return true;
  }
  return true;
}

function nextStep() {
  if (state.step === 0) readFormStep0();
  if (state.step === 1) readFormStep1();
  if (!validateStep(state.step)) return;
  state.step++;
  render();
  window.scrollTo(0, 0);
}
function prevStep() {
  if (state.step === 2) readFormStep2();
  if (state.step === 1) readFormStep1();
  state.step--;
  render();
  window.scrollTo(0, 0);
}
function goResults() {
  readFormStep2();
  state.step = 3;
  render();
  window.scrollTo(0, 0);
}

function attachListeners() {
  const aliqEl = document.getElementById('f_aliq');
  if (aliqEl) {
    aliqEl.addEventListener('input', function() {
      state.aliquota = parseFloat(this.value);
      document.getElementById('app').innerHTML = renderStep2();
      attachListeners();
    });
  }
}

// ================================================================
// PDF GENERATION
// ================================================================
async function gerarPDF() {
  const btn = document.getElementById('btnPDF');
  const el  = document.getElementById('resultado-pdf');
  if (!el) return;

  // Hide interactive elements inside the results div
  const tabs    = el.querySelector('.scenario-tabs');
  const actions = el.querySelector('.pdf-actions');
  if (tabs)    tabs.style.display    = 'none';
  if (actions) actions.style.display = 'none';

  if (btn) { btn.disabled = true; btn.textContent = '⏳ Gerando PDF…'; }

  // Add a simple print header for the PDF
  const pdfHeader = document.createElement('div');
  pdfHeader.id = 'pdf-header-temp';
  pdfHeader.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 0 16px;border-bottom:2px solid #0d7377;margin-bottom:16px;';
  pdfHeader.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;background:linear-gradient(135deg,#0d7377,#14a085);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:700;">CE</div>
      <div>
        <div style="font-size:16px;font-weight:700;color:#0f2744;">Simulador Previdenciário - COGERH</div>
        <div style="font-size:10px;color:#6b7fa3;letter-spacing:1px;text-transform:uppercase;">RPPS · RPC · CE-Prevcom</div>
      </div>
    </div>
    <div style="font-size:10px;color:#6b7fa3;text-align:right;">Gerado em ${new Date().toLocaleDateString('pt-BR')}</div>`;
  el.insertBefore(pdfHeader, el.firstChild);

  const opt = {
    margin:     [8, 8, 8, 8],
    filename:   'simulacao_prevcom_cogerh.pdf',
    image:      { type: 'jpeg', quality: 0.97 },
    html2canvas:{ scale: 2, useCORS: true, logging: false },
    jsPDF:      { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  try {
    await html2pdf().set(opt).from(el).save();
  } catch(e) {
    alert('Erro ao gerar PDF. Tente usar o botão Imprimir.');
  }

  // Restore
  el.removeChild(pdfHeader);
  if (tabs)    tabs.style.display    = '';
  if (actions) actions.style.display = '';
  if (btn) { btn.disabled = false; btn.textContent = '📄 Baixar PDF da Simulação'; }
}

// ================================================================
// INIT
// ================================================================
render();
</script>
</body>
</html>
